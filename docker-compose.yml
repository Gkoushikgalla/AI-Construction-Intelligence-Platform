version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=sitemind-ai-super-secret-key-development-2026
      - DATABASE_URL=sqlite:///./sitemind.db
      - STORAGE_DIR=./uploaded_evidence
    volumes:
      - ./backend/uploaded_evidence:/app/uploaded_evidence

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
